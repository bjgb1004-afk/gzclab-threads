name: Genius picks series

# 월~금 천재 1명의 5게임, 토요일 명당 5게임, 토요일 밤 채점. 무엇을 할지는 lotto_picks.py auto가
# 시각을 보고 정한다. 모든 단계가 picks.json 기준으로 멱등이라 여러 번 돌아도 한 번만 올라간다.
on:
  schedule:
    # 번호 글: 월~토 17:07 KST(UTC 08:07). 19:37 KST(UTC 10:37)는 Actions가 예약 실행을
    # 빼먹었을 때의 백업. 토요일 20시 판매 마감 전이라 둘 다 명당 번호를 살 시간이 있다.
    # 기존 발행 슬롯(07:07 / 12:07 / 21:07)과 겹치지 않게 :07·:37로 둔다.
    - cron: "7 8 * * 1-6"
    - cron: "37 10 * * 1-6"
    # 채점: 추첨은 토 20:45 KST. 토 21:37 / 22:37 / 23:37, 일 07:37 / 11:37 KST에 시도한다.
    # 당첨번호 미러가 늦게 올라와도 일요일 오전 안에는 결과가 나가고, 11:37에도 없으면 텔레그램 알림.
    - cron: "37 12 * * 6"
    - cron: "37 13 * * 6"
    - cron: "37 14 * * 6"
    - cron: "37 22 * * 6"
    - cron: "37 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threads-lotto-picks
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Post today's picks or this week's result
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python lotto_picks.py auto

      # 발행에 성공했으면 실패 단계가 있어도 기록은 남겨야 다음 실행이 같은 글을 또 올리지 않는다.
      - name: Commit picks
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add picks.json queue.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record picks"
          # 발행 워크플로가 같은 queue.json을 커밋한다. 밀렸으면 rebase해서 올린다.
          git pull --rebase --autostash && git push
