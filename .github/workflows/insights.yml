name: Collect Threads Insights

on:
  schedule:
    - cron: "30 15 * * *"  # KST 00:30 — 그날 발행분 트래픽 다 지난 뒤
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: threads-insights
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect insights for published posts
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python collect_insights.py

      - name: Commit insights
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add queue.json
          git diff --cached --quiet || git commit -m "chore: record insights"
          # lotto-picks 워크플로도 queue.json을 커밋한다. 그쪽이 먼저 올렸으면 그냥 push는
          # 거절되고, 발행 기록이 사라져 같은 글이 다음 슬롯에 또 나간다. rebase해서 올린다.
          git pull --rebase --autostash && git push
