name: Tick

# 발행·번호글·자동답글·인사이트를 한 워크플로가 상시 루프로 돌린다.
#
# 왜: Actions의 schedule이 이 저장소에서 심하게 씹힌다. */10 크론이 하루 2~7번만 떴고
# (9/25~9/30 실측), 그 탓에 번호 글이 17:07 예정인데 23:16~01:43에 나갔고 자동답글은
# 댓글의 15%만 답했다. 크론 횟수를 늘려도 같은 비율로 씹히므로, 한 번 뜬 실행이 오래
# 돌게 한다. 저장소가 public이라 Actions 분은 무제한이다.
#
# 다음 실행으로의 인계는 크론과 concurrency 큐가 한다. 루프가 도는 5시간 45분 동안
# 크론이 계속 뜨고, 그 run들은 아래 concurrency group이 잡혀 있어 '대기'로 줄을 선다.
# 줄에는 한 자리뿐이라 새 run이 오면 앞의 대기 run은 cancelled가 되고(실행은 안 했으므로
# 러너 시간 0), 맨 마지막 대기 run이 앞 run이 끝나는 순간 시작한다. 2026-10-17~18 실측:
# 09:18끝→09:18시작→15:05끝→15:05시작→20:53끝→20:53시작→02:40끝→02:40시작→08:28:01끝→08:28:03시작.
# 32시간 동안 인계 공백 2초였다.
#
# run 목록의 cancelled는 실패가 아니다 — 위의 '줄 서다 교체된 대기 run'이다. 진단할 때
# 실제로 돈 run만 보려면 cancelled를 빼고 봐야 한다(gh api .../runs/<id>/jobs 가 0이면 대기만 한 것).
#
# 예전엔 마지막에 PAT로 `gh workflow run`을 불러 다음 실행을 직접 띄웠다. 그 PAT(GH_PAT)는
# 토큰 자동갱신용으로 `Secrets: Read and write` 하나만 주도록 일부러 좁게 만든 것이라
# (SETUP.md) 워크플로를 띄울 권한이 없고, 매 실행 끝에서 403으로 조용히 실패하고 있었다
# (`|| true`로 묻혔다). 위 실측대로 큐가 이미 인계를 하고 있으므로 그 스텝을 지웠다.
# PAT에 Actions 권한을 더하는 쪽이 아니라 지우는 쪽을 택한 이유: 무기한 토큰의 권한을
# 넓히지 않으려고.
#
# ponytail: 크론이 5시간 45분 내내 한 번도 안 뜨면 줄이 비어 루프가 끊긴다(그 창에 크론
# 기회는 11번). 끊기면 다음 크론이 뜰 때까지 멈춘다. 실제로 공백이 생기기 시작하면
# Actions 권한이 있는 별도 PAT나 GitHub App으로 체인 스텝을 되살리는 게 다음 단계다.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# 두 개가 동시에 돌면 같은 글이 두 번 나간다. 겹치면 뒤엣것이 앞엣것을 기다린다.
concurrency:
  group: threads-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    # 잡 상한은 6시간. 루프를 5시간 45분에서 끊어 마지막 커밋·푸시에 15분을 남긴다.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      # 스레드 파이프라인은 표준 라이브러리만 쓴다. 이 둘은 인스타 카드(cards.py)를
      # 그리는 데만 필요하다 — 없으면 인스타 단계만 죽고 스레드는 그대로 돈다.
      - name: Card deps
        run: |
          pip install --quiet Pillow
          # 굵기 구분이 있는 CJK 글꼴. 깔리지 않으면 cards.py가 저장소의 Bold 하나로 떨어진다.
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk || true

      - name: Loop
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          END=$(( $(date +%s) + 20700 ))   # 5시간 45분
          while [ "$(date +%s)" -lt "$END" ]; do
            git pull --rebase --autostash -q || true
            python tick.py || true
            # 카드는 커밋돼야 인스타가 받아간다(raw 주소로 내려받는다). instagram.json은
            # 발행 기록 — 사라지면 다음 틱이 같은 걸 또 올린다. 아직 없는 경로가 섞여도
            # 나머지 add가 죽지 않게 하나씩 더한다.
            for f in queue.json picks.json instagram.json cards; do
              git add -A "$f" 2>/dev/null || true
            done
            # 발행·답글 기록이 사라지면 다음 틱이 같은 글을 또 올린다. 커밋은 매 틱마다.
            if ! git diff --cached --quiet; then
              git commit -q -m "chore: tick"
              git pull --rebase --autostash -q && git push -q || true
            fi
            sleep 300
          done
