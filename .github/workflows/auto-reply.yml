name: Auto reply to comments

on:
  schedule:
    # 10분마다. Actions cron은 최소 5분이고 실제로는 더 밀리므로, 답글까지 5~20분
    # 걸린다고 보면 된다. public 저장소라 실행 분 제한은 없다.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# 실행이 밀려 두 개가 겹치면 같은 댓글에 답글이 두 번 달린다. 앞의 것이 끝나기를 기다린다.
concurrency:
  group: threads-auto-reply
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 커밋 단계가 없다: 답글 이력은 Threads에 남고 conversation으로 다시 읽히므로
      # 저장소에 쓸 것이 없다.
      - name: Reply to new comments
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python auto_reply.py
