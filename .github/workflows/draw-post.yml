name: Queue weekly draw post

on:
  schedule:
    # 추첨은 토 20:45 KST. 당첨판매점 API는 그날 밤에 채워진다(1243회 실측).
    # 토 23:30 KST(UTC 토 14:30)에 한 번, 아직 비어 있으면 일 05:30 KST(UTC 토 20:30)에 한 번 더.
    # 둘 다 일요일 아침 발행(07:07 KST)보다 앞이라, 한쪽만 성공해도 그 주 글이 나간다.
    - cron: "30 14 * * 6"
    - cron: "30 20 * * 6"
  workflow_dispatch:

permissions:
  contents: write

# 두 cron이 겹치면 같은 회차 글이 두 번 꽂힐 수 있다(id 중복 체크가 있지만 push가 꼬인다).
concurrency:
  group: threads-draw-post
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Queue this week's draw post
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gen_draw_post.py

      - name: Commit queue
        if: success()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add queue.json
          git diff --cached --quiet || git commit -m "feat: queue draw post"
          # 발행 워크플로가 이 커밋을 checkout해야 한다. 밀린 커밋이 있으면 rebase해서 올린다.
          git pull --rebase --autostash && git push

      # 첫 cron(토 23:30)이 비어서 실패하는 건 정상 경로다. 늦은 cron까지 실패하면
      # 그 주 회차글이 안 나가므로 그때만 알린다.
      - name: Alert if the late run failed
        if: failure() && github.event.schedule == '30 20 * * 6'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage"             -d chat_id="$TELEGRAM_CHAT_ID"             --data-urlencode "text=❌ 회차 배출점 글 생성 실패 — 이번 주 일요일 회차글 없음. Actions 로그 확인." > /dev/null
