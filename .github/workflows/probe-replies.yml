name: Probe replies permission

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check replies scope
        env:
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
        run: |
          set -o pipefail
          ID=$(curl -s "https://graph.threads.net/v1.0/me/threads?fields=id,text&limit=1&access_token=$THREADS_TOKEN" \
               | python -c "import json,sys;d=json.load(sys.stdin);print(d['data'][0]['id'] if d.get('data') else 'ERR '+json.dumps(d)[:300])")
          echo "MEDIA=$ID"
          case "$ID" in ERR*) exit 1;; esac
          echo "--- replies ---"
          curl -s "https://graph.threads.net/v1.0/$ID/replies?fields=id,text,username,timestamp&access_token=$THREADS_TOKEN" | head -c 1200
          echo
          echo "--- conversation ---"
          curl -s "https://graph.threads.net/v1.0/$ID/conversation?fields=id,text,username&access_token=$THREADS_TOKEN" | head -c 600
